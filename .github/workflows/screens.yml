name: Screenshots

# Builds a Debug copy, runs it against the mock gateway and saves screenshots of the window,
# so the look can be checked without a Mac.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: screens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screens:
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)"

      - name: Build VoryMac Debug
        run: |
          set -o pipefail
          xcodebuild -project Vory.xcodeproj -scheme VoryMac -configuration Debug \
            -destination 'generic/platform=macOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            build 2>&1 | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Debug/*.app

      - name: Demo copy
        run: |
          SRC="$(ls -d build/Build/Products/Debug/*.app | head -1)"
          Tools/dev/make-demo-app.sh "$SRC" demo

      - name: Mock gateway
        run: |
          python3 -m pip install --quiet --break-system-packages websockets pyobjc-framework-Quartz || python3 -m pip install --quiet websockets
          nohup python3 Tools/mock-gateway/mock_gateway.py --port 9119 --token mock-token > mock.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:9119/api/status >/dev/null && break; sleep 1; done

      - name: Screen near a MacBook Air, transparency on
        continue-on-error: true
        run: |
          brew install jakehilborn/jakehilborn/displayplacer >/dev/null 2>&1 || true
          displayplacer list > display.log 2>&1 || true
          ID=$(displayplacer list | awk '/Persistent screen id:/{print $4; exit}')
          # The runner's virtual screen has no 1470x956 or Retina modes; 1600x900 is the closest.
          displayplacer "id:$ID res:1600x900 hz:60 color_depth:7" >> display.log 2>&1 || true
          # Glass shows as solid grey with Reduce Transparency on; make sure it is off.
          echo "reduceTransparency before: $(defaults read com.apple.universalaccess reduceTransparency 2>&1)" >> display.log
          defaults write com.apple.universalaccess reduceTransparency -bool false >> display.log 2>&1 || sudo defaults write com.apple.universalaccess reduceTransparency -bool false >> display.log 2>&1 || true
          defaults write com.apple.universalaccess increaseContrast -bool false >> display.log 2>&1 || true
          echo "reduceTransparency after: $(defaults read com.apple.universalaccess reduceTransparency 2>&1)" >> display.log
          system_profiler SPDisplaysDataType >> display.log 2>&1 || true

      - name: Run and capture
        run: |
          mkdir -p shots crash
          defaults write -g AppleInterfaceStyle Dark
          defaults write com.vorantx.vory.demo companionPromptShown -bool true
          APP=demo/Vory.app
          BIN="$APP/Contents/MacOS/$(defaults read "$PWD/$APP/Contents/Info" CFBundleExecutable)"
          # Any step that talks to the app gives up after 25 s: a frozen app used to stall the whole run.
          t() { perl -e 'alarm shift; exec @ARGV' 25 "$@"; }
          shot() {  # name, extra args, wait
            "$BIN" -vory-demo-gateway http://127.0.0.1:9119 mock-token Home $2 >> app.log 2>&1 &
            PID=$!
            sleep "$3"
            t osascript -e 'tell application id "com.vorantx.vory.demo" to activate' || true
            sleep 2
            # No window yet: ask for it from the Window menu, as a person would.
            t osascript -e 'tell application "System Events" to tell (first process whose bundle identifier is "com.vorantx.vory.demo") to click (first menu item of menu "Window" of menu bar 1 whose name starts with "Artha")' >> app.log 2>&1 || true
            sleep 4
            # Fill the screen, as the app would sit on a MacBook Air.
            t osascript -e 'tell application "Finder" to set b to bounds of window of desktop' -e 'tell application "System Events" to tell (first process whose bundle identifier is "com.vorantx.vory.demo") to tell window 1 to set {position, size} to {{0, 30}, {(item 3 of b), (item 4 of b) - 30}}' >> app.log 2>&1 || true
            sleep 3
            echo "== $1: windows" >> app.log
            t python3 -c 'import Quartz;[print(w.get("kCGWindowOwnerName"),w.get("kCGWindowName"),dict(w.get("kCGWindowBounds")),w.get("kCGWindowLayer")) for w in Quartz.CGWindowListCopyWindowInfo(0,0)]' >> app.log 2>&1 || true
            t screencapture -x "shots/$1.png"
            sample $PID 2 -file "crash/sample-$1.txt" >/dev/null 2>&1 || true
            t log show --last 1m --predicate "processID == $PID AND eventMessage CONTAINS '[plugins]' OR eventMessage CONTAINS '[layout]'" --style compact > "crash/our-$1.txt" 2>&1 || true
            t log show --last 1m --style compact --predicate "processID == $PID" > "crash/log-$1.txt" 2>&1 || true
            kill $PID 2>/dev/null || true
            sleep 3
          }
          open -a Calculator; sleep 5; screencapture -x shots/00-calculator.png; osascript -e 'quit app "Calculator"' || true
          mkdir -p ~/.hermes/desktop-plugins/hello && cp Tools/ci/hello-plugin/plugin.js ~/.hermes/desktop-plugins/hello/
          mkdir -p ~/.hermes/desktop-plugins/workflows && cp Tools/ci/workflows-plugin/plugin.js ~/.hermes/desktop-plugins/workflows/
          shot 01-empty "" 20
          shot 02-chat "-vibe-open-chat 20260921_154212_a1b2c3" 25
          shot 03-chat-tools "-vibe-open-chat 20260921_093355_d4e5f6" 25
          shot 04-plugin "-vibe-open-plugin /hello" 25
          shot 04b-plugin-workflows "-vibe-open-plugin /workflows" 25
          shot 05-sidebar-hidden "-vibe-sidebar hidden -vibe-open-chat 20260921_093355_d4e5f6" 25
          shot 06-sidebar-reveal "-vibe-sidebar reveal -vibe-open-chat 20260921_093355_d4e5f6" 25
          shot 07-palette "-vibe-open-palette" 25
          shot 09-settings "-vibe-open-settings" 25
          shot 08-glass-lab "-vibe-glass-lab" 20
          ls -la shots
          mkdir -p crash; cp ~/Library/Logs/DiagnosticReports/*.ips crash/ 2>/dev/null || true
          find "$TMPDIR" /var/folders -name vibe-plugin-snapshot.png -exec cp {} shots/ \; 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: |
            shots/
            app.log
            mock.log
            build.log
            display.log
            crash/
          retention-days: 14
