name: Screenshots

# Builds a Debug copy, runs it against the mock gateway and saves screenshots of the window,
# so the look can be checked without a Mac.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: screens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screens:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)"

      - name: Build VoryMac Debug
        run: |
          set -o pipefail
          xcodebuild -project Vory.xcodeproj -scheme VoryMac -configuration Debug \
            -destination 'generic/platform=macOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            build 2>&1 | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Debug/*.app

      - name: Demo copy
        run: |
          SRC="$(ls -d build/Build/Products/Debug/*.app | head -1)"
          mkdir -p "$SRC/Contents/Resources/PluginHost" && cp -R PluginHost/dist/. "$SRC/Contents/Resources/PluginHost/"
          Tools/dev/make-demo-app.sh "$SRC" demo

      - name: Mock gateway
        run: |
          python3 -m pip install --quiet --break-system-packages websockets pyobjc-framework-Quartz || python3 -m pip install --quiet websockets
          nohup python3 Tools/mock-gateway/mock_gateway.py --port 9119 --token mock-token > mock.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:9119/api/status >/dev/null && break; sleep 1; done

      - name: Run and capture
        run: |
          mkdir -p shots crash
          defaults write -g AppleInterfaceStyle Dark
          APP=demo/Vory.app
          BIN="$APP/Contents/MacOS/$(defaults read "$PWD/$APP/Contents/Info" CFBundleExecutable)"
          shot() {  # name, extra args, wait
            "$BIN" -vory-demo-gateway http://127.0.0.1:9119 mock-token Home $2 >> app.log 2>&1 &
            PID=$!
            sleep "$3"
            osascript -e 'tell application id "com.vorantx.vory.demo" to activate' || true
            sleep 2
            # No window yet: ask for it from the Window menu, as a person would.
            osascript -e 'tell application "System Events" to tell (first process whose bundle identifier is "com.vorantx.vory.demo") to click (first menu item of menu "Window" of menu bar 1 whose name starts with "Vory")' >> app.log 2>&1 || true
            sleep 4
            echo "== $1: windows" >> app.log
            python3 -c 'import Quartz;[print(w.get("kCGWindowOwnerName"),w.get("kCGWindowName"),dict(w.get("kCGWindowBounds")),w.get("kCGWindowLayer")) for w in Quartz.CGWindowListCopyWindowInfo(0,0)]' >> app.log 2>&1 || true
            screencapture -x "shots/$1.png"
            osascript Tools/ci/ax.applescript > "crash/ax-$1.txt" 2>&1 || true
            sample $PID 2 -file "crash/sample-$1.txt" >/dev/null 2>&1 || true
            log show --last 1m --style compact --predicate "processID == $PID" > "crash/log-$1.txt" 2>&1 || true
            kill $PID 2>/dev/null || true
            sleep 3
          }
          open -a Calculator; sleep 5; screencapture -x shots/00-calculator.png; osascript -e 'quit app "Calculator"' || true
          mkdir -p ~/.hermes/desktop-plugins/hello && cp Tools/ci/hello-plugin/plugin.js ~/.hermes/desktop-plugins/hello/
          shot 01-empty "" 20
          shot 02-chat "-vibe-open-chat 20260921_154212_a1b2c3" 25
          shot 03-chat-tools "-vibe-open-chat 20260921_093355_d4e5f6" 25
          shot 04-plugin "-vibe-open-plugin /hello" 25
          ls -la shots
          mkdir -p crash; cp ~/Library/Logs/DiagnosticReports/*.ips crash/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: |
            shots/
            app.log
            mock.log
            build.log
            crash/
          retention-days: 14
