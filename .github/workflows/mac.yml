name: Mac build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Build VoryMac (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Vory.xcodeproj -scheme VoryMac -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release/*.app

      - name: Sign and zip
        env:
          ARTHA_SIGN_P12: ${{ secrets.ARTHA_SIGN_P12 }}
          ARTHA_SIGN_PASS: ${{ secrets.ARTHA_SIGN_PASS }}
        run: |
          APP=$(ls -d build/Build/Products/Release/*.app | head -1)
          # No extensions and no entitlements: they need Apple's provisioning. Push, widgets and
          # iCloud sync are off in this build; logins go to the login keychain.
          rm -rf "$APP/Contents/PlugIns" "$APP/Contents/embedded.provisionprofile" "$APP/Contents/_CodeSignature"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier dev.raturi.vibevory" "$APP/Contents/Info.plist"
          # The app is "Artha" in Finder and the Dock.
          mv "$APP" build/Build/Products/Release/Artha.app && APP=build/Build/Products/Release/Artha.app
          # The build number Artha's updater compares against the latest release.
          /usr/libexec/PlistBuddy -c "Add :ArthaBuild integer ${{ github.run_number }}" "$APP/Contents/Info.plist"
          # One permanent self-signed identity (repo secrets), so macOS sees every build as the same app:
          # "Always Allow" on a keychain item then carries over to later builds and updates. Ad-hoc without it.
          if [ -n "$ARTHA_SIGN_P12" ]; then
            echo "$ARTHA_SIGN_P12" | base64 --decode > sign.p12
            security create-keychain -p ci sign.keychain
            security set-keychain-settings sign.keychain
            security unlock-keychain -p ci sign.keychain
            security import sign.p12 -k sign.keychain -P "$ARTHA_SIGN_PASS" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci sign.keychain > /dev/null
            security list-keychains -d user -s sign.keychain $(security list-keychains -d user | tr -d '"')
            HASH=$(security find-certificate -c "Artha Self-Signed" -Z sign.keychain | awk '/SHA-1/{print $NF}')
            codesign --force --deep --sign "$HASH" --keychain sign.keychain "$APP"
            rm -f sign.p12
          else
            codesign --force --deep --sign - "$APP"
          fi
          codesign -d -r- "$APP" 2>&1 | tail -1
          codesign --verify --deep "$APP"
          mkdir -p out && ditto -c -k --keepParent "$APP" out/Artha-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Artha-mac
          path: out/Artha-mac.zip
          retention-days: 14

      # Every build of master is a release: Artha checks the latest one and updates itself from it.
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=${{ github.run_number }}
          git log -1 --format=%B > notes.txt
          gh release create "build-$N" out/Artha-mac.zip --title "Artha build $N" --notes-file notes.txt --target "$GITHUB_SHA" --latest

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
